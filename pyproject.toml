[project]
name = "house-prices"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alp Efe Karalar", email = "karalar.alpefe@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optuna>=5.1.0",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]

[project.scripts]
house-prices = "house_prices:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
